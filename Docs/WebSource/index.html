<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>City Walk preview</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
           font-family: Arial, "Liberation Sans", "DejaVu Sans", Helvetica, sans-serif; color: #f4efe0; }
  #c { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  .card { position: absolute; box-sizing: border-box; background: rgba(9, 46, 38, 0.90);
          border: 2px solid rgba(214, 178, 94, 0.45); border-radius: 22px; }
  #title { left: 40px; top: 36px; width: 362px; height: 106px; }
  #title .icon { position: absolute; left: 18px; top: 18px; width: 68px; height: 68px; border-radius: 14px;
                 background: linear-gradient(160deg, #f0d48a, #c79a3c); }
  #title .icon svg { position: absolute; left: 10px; top: 10px; width: 48px; height: 48px; }
  #title .t1 { position: absolute; left: 104px; top: 18px; font-size: 34px; font-weight: bold; }
  #title .t2 { position: absolute; left: 104px; top: 62px; font-size: 22px; color: #d9d3c0; }
  #lap { left: 420px; top: 36px; width: 130px; height: 106px; text-align: center; }
  #lap .l1 { margin-top: 14px; font-size: 19px; letter-spacing: 2px; color: #cfc8b2; }
  #lap .l2 { font-size: 42px; font-weight: bold; margin-top: 2px; }
  #banner { left: 590px; top: 36px; width: 740px; height: 106px; border-left: 7px solid #e3bd62; }
  #banner .b1 { position: absolute; left: 28px; top: 16px; font-size: 33px; font-weight: bold; color: #e9c568; }
  #banner .b2 { position: absolute; left: 28px; top: 62px; font-size: 23px; color: #ece6d4; }
  #banner.warn { border-color: #ff8a5c; background: rgba(74, 22, 14, 0.92); }
  #banner.warn .b1 { color: #ffb08a; }
  #pace { left: 590px; top: 158px; height: 56px; border-radius: 28px; padding: 0 30px 0 22px;
          font-size: 23px; line-height: 52px; white-space: nowrap; }
  #pace svg { width: 26px; height: 30px; vertical-align: -7px; margin-right: 10px; }
  #xp { left: 1548px; top: 40px; width: 222px; height: 82px; text-align: center; font-size: 28px; line-height: 78px; }
  #xp .star { color: #e9c568; margin-right: 8px; }
  #xpfloat { position: absolute; left: 1348px; width: 422px; text-align: right; font-size: 30px; font-weight: bold;
             color: #f3d27a; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #coin { left: 1548px; top: 134px; width: 222px; height: 58px; text-align: center; font-size: 26px; line-height: 54px; }
  #coin .cdot { display: inline-block; width: 26px; height: 26px; border-radius: 13px; box-sizing: border-box; border: 2px solid #b8860b;
                background: radial-gradient(circle at 35% 30%, #fff0b0, #d9a520); vertical-align: -5px; margin-right: 10px; }
  #pacebar { display: inline-block; width: 120px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.16); margin-left: 18px; overflow: hidden; }
  #pacefill { display: block; height: 12px; border-radius: 6px; background: #7fe0a0; width: 50%; }
  #pace.slow { border-color: #ffb347; background: rgba(92, 54, 8, 0.94); }
  #lapdone { left: 610px; top: 330px; width: 700px; height: 150px; border-radius: 26px; border: 2px solid #e3bd62; text-align: center; background: rgba(8, 42, 34, 0.95); }
  #lapdone .ld1 { margin-top: 24px; font-size: 50px; font-weight: bold; color: #f3d27a; letter-spacing: 2px; }
  #lapdone .ld2 { margin-top: 8px; font-size: 27px; }
  #done .stars { margin-top: 8px; font-size: 52px; letter-spacing: 12px; line-height: 58px; }
  #hp { left: 40px; top: 158px; width: 362px; height: 56px; }
  #hp .heart { position: absolute; left: 20px; top: 7px; font-size: 31px; color: #ff6b6b; }
  #hpbar { position: absolute; left: 64px; top: 20px; width: 216px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.16); overflow: hidden; }
  #hpfill { display: block; height: 14px; border-radius: 7px; background: #7fe0a0; }
  #hpv { position: absolute; right: 22px; top: 11px; font-size: 26px; font-weight: bold; }
  #hpfloat { position: absolute; left: 414px; top: 166px; font-size: 32px; font-weight: bold; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  #hurt { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: radial-gradient(ellipse at center, rgba(210,0,0,0) 42%, rgba(210,0,0,0.8) 100%); }
  #fail { left: 580px; top: 250px; width: 760px; height: 560px; border-radius: 30px; border: 2px solid #ff8a5c; background: rgba(46, 14, 12, 0.97); text-align: center; }
  #fail .d0 { margin-top: 46px; font-size: 22px; letter-spacing: 4px; color: #ffb08a; }
  #fail .d1 { margin-top: 14px; font-size: 56px; font-weight: bold; color: #ffe2d2; }
  #fail .d2 { margin-top: 14px; font-size: 24px; color: #f0d6cc; }
  #fail .stats { position: absolute; left: 64px; top: 232px; }
  #fail .stat { position: absolute; top: 0; width: 192px; height: 132px; box-sizing: border-box; border-radius: 18px; background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,138,92,0.4); }
  #fail .stat b { display: block; margin-top: 22px; font-size: 44px; color: #ffb08a; }
  #fail .stat span { font-size: 21px; color: #f0d6cc; }
  #fail .btn { top: 400px; }
  #quit { left: 116px; width: 254px; border: 2px solid #ff8a5c; color: #ffe2d2; }
  #retry { left: 394px; width: 250px; background: linear-gradient(180deg, #f1d68c, #cda040); color: #0c3b30; line-height: 86px; }
  #pausebtn { left: 1790px; top: 40px; width: 90px; height: 90px; border-radius: 45px; }
  #pausebtn i { position: absolute; top: 28px; width: 12px; height: 34px; background: #f4efe0; border-radius: 2px; }
  #joy { position: absolute; box-sizing: border-box; left: 111px; top: 747px; width: 252px; height: 252px; border-radius: 126px; background: rgba(9, 46, 38, 0.78);
         border: 2px solid rgba(214, 178, 94, 0.7); }
  #knob { position: absolute; width: 104px; height: 104px; border-radius: 52px;
          background: radial-gradient(circle at 40% 35%, #ffffff, #e4dfd0 70%); box-shadow: 0 4px 10px rgba(0,0,0,.4); }
  #coffee { position: absolute; left: 1644px; top: 710px; width: 230px; height: 230px; border-radius: 115px;
            background: rgba(201, 160, 70, 0.35); }
  #coffee .in { position: absolute; left: 10px; top: 10px; width: 210px; height: 210px; border-radius: 105px;
                background: radial-gradient(circle at 40% 30%, #f6de9a, #d2a443 75%); text-align: center;
                color: #0c3b30; font-weight: bold; font-size: 25px; line-height: 28px; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  #coffee svg { width: 70px; height: 62px; margin-top: 34px; }
  #wrong { left: 660px; top: 238px; width: 600px; height: 84px; border-radius: 42px; text-align: center;
           background: rgba(120, 28, 16, 0.94); border-color: #ff9a6c; font-size: 34px; font-weight: bold; line-height: 80px; color: #ffe2d2; }
  #dim { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: rgba(4, 14, 11, 0.55); }
  #done { left: 580px; top: 225px; width: 760px; height: 630px; border-radius: 30px; border: 2px solid #e3bd62;
          background: rgba(8, 42, 34, 0.97); text-align: center; }
  #done .d0 { margin-top: 46px; font-size: 22px; letter-spacing: 4px; color: #e3bd62; }
  #done .d1 { margin-top: 14px; font-size: 52px; font-weight: bold; }
  #done .d2 { margin-top: 14px; font-size: 25px; color: #e4decb; }
  #done .stats { position: absolute; left: 64px; top: 292px; }
  #done .stat { position: absolute; top: 0; width: 192px; height: 132px; box-sizing: border-box; border-radius: 18px;
                background: rgba(255,255,255,0.07); border: 1.5px solid rgba(214,178,94,0.35); }
  #done .stat b { display: block; margin-top: 22px; font-size: 44px; color: #edc76a; }
  #done .stat span { font-size: 21px; color: #e4decb; }
  .btn { position: absolute; top: 470px; height: 86px; border-radius: 43px; box-sizing: border-box; font-size: 27px;
         font-weight: bold; line-height: 82px; text-align: center; }
  #replay { left: 116px; width: 254px; border: 2px solid #e3bd62; color: #f4efe0; }
  #cont { left: 394px; width: 250px; background: linear-gradient(180deg, #f1d68c, #cda040); color: #0c3b30; line-height: 86px; }
  #paused { left: 660px; top: 380px; width: 600px; height: 300px; border-radius: 30px; border: 2px solid #e3bd62;
            background: rgba(8, 42, 34, 0.97); text-align: center; }
  #paused .p1 { margin-top: 48px; font-size: 48px; font-weight: bold; }
  #resume { position: absolute; left: 175px; top: 160px; width: 250px; height: 86px; border-radius: 43px;
            background: linear-gradient(180deg, #f1d68c, #cda040); color: #0c3b30; font-size: 27px; font-weight: bold; line-height: 86px; }
  #note { position: absolute; left: 460px; top: 1004px; width: 1000px; text-align: center; }
  #note span { display: inline-block; background: rgba(0,0,0,0.62); border-radius: 22px; padding: 9px 26px; font-size: 23px; color: #fff; }
  #note b { color: #f3d27a; font-weight: bold; margin-right: 8px; }
  #touch { position: absolute; width: 90px; height: 90px; border-radius: 45px; border: 5px solid rgba(255,255,255,.9);
           background: rgba(255,255,255,.3); box-sizing: border-box; }
  #fade { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #000; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>

  <div id="title" class="card">
    <div class="icon"><svg viewBox="0 0 24 24"><rect x="2" y="9" width="6" height="13" fill="#0c3b30"/><rect x="9" y="3" width="7" height="19" fill="#12493c"/><rect x="17" y="11" width="5" height="11" fill="#0c3b30"/></svg></div>
    <div class="t1">City Walk</div><div class="t2">Morning routine</div>
  </div>
  <div id="hp" class="card"><span class="heart">&#9829;</span><span id="hpbar"><i id="hpfill"></i></span><span id="hpv">70</span></div>
  <div id="hpfloat"></div>
  <div id="lap" class="card"><div class="l1">LAP</div><div class="l2" id="lapv">1/3</div></div>
  <div id="banner" class="card"><div class="b1" id="b1"></div><div class="b2" id="b2"></div></div>
  <div id="pace" class="card"><svg viewBox="0 0 26 30"><circle cx="14" cy="4" r="3.6" fill="#e9c568"/><path d="M14 9 L11 18 L6 27 M11 18 L17 21 L18 28 M13 11 L7 15 M14 11 L20 15" stroke="#e9c568" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="pacev"></span><span id="pacebar"><i id="pacefill"></i></span></div>
  <div id="xp" class="card"><span class="star">&#9733;</span><span id="xpv">0 XP</span></div>
  <div id="coin" class="card"><span class="cdot"></span><span id="coinv">0</span></div>
  <div id="xpfloat"></div>
  <div id="lapdone" class="card"><div class="ld1" id="ld1"></div><div class="ld2" id="ld2"></div></div>
  <div id="pausebtn" class="card"><i style="left:27px"></i><i style="left:49px"></i></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="coffee"><div class="in">
    <svg viewBox="0 0 70 62"><path d="M24 4 q-5 6 0 12 M35 2 q-5 7 0 14 M46 4 q-5 6 0 12" stroke="#0c3b30" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M12 24 h42 v14 a18 18 0 0 1 -18 18 h-6 a18 18 0 0 1 -18 -18 z" fill="#0c3b30"/><path d="M54 28 h5 a8 8 0 0 1 0 16 h-6" stroke="#0c3b30" stroke-width="5" fill="none"/></svg>
    <div>Tap to grab<br>coffee</div></div></div>
  <div id="wrong" class="card">Wrong way: turn around</div>

  <div id="hurt"></div>
  <div id="dim"></div>
  <div id="fail" class="card">
    <div class="d0">GAME OVER</div>
    <div class="d1">Mission failed</div>
    <div class="d2" id="fsub"></div>
    <div class="stats">
      <div class="stat" style="left:0"><b id="flap">0/3</b><span>Laps</span></div>
      <div class="stat" style="left:220px"><b id="fcoin">0</b><span>Coins</span></div>
      <div class="stat" style="left:440px"><b id="ftime">0:00</b><span>Time</span></div>
    </div>
    <div id="quit" class="btn">Quit</div><div id="retry" class="btn">Retry</div>
  </div>
  <div id="done" class="card">
    <div class="d0">ROUTE COMPLETE</div>
    <div class="d1">You made it to the office</div>
    <div class="stars" id="stars"></div>
    <div class="d2" id="dsub"></div>
    <div class="stats">
      <div class="stat" style="left:0"><b id="sxp">+250</b><span>XP</span></div>
      <div class="stat" style="left:220px"><b id="scoin">+40</b><span>Coins</span></div>
      <div class="stat" style="left:440px"><b id="stime">0:00</b><span>Time</span></div>
    </div>
    <div id="replay" class="btn">Replay</div><div id="cont" class="btn">Continue</div>
  </div>
  <div id="paused" class="card"><div class="p1">Paused</div><div id="resume">Resume</div></div>

  <div id="note"><span><b id="noteb"></b><i id="notet" style="font-style:normal"></i></span></div>
  <div id="touch"></div>
  <div id="fade"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
